# Builds the superexec image and pushes it to Artifact Registry.
# $PROJECT_ID is substituted automatically by Cloud Build.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'superexec.Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/flower-gcp-example-artifacts/handwriting-superexec:0.0.1'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/flower-gcp-example-artifacts/handwriting-superexec:0.0.1'
timeout: 3600s
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
