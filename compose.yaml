# created with docker --init
# to run docker compose (all services) do: docker-compose -f compose.yaml up

# according to source: https://stackoverflow.com/questions/30233105/docker-compose-up-for-only-certain-containers
# to run docker compose (specific service only) do: docker compose -f compose.yaml up xxxxxx
# for example: docker compose -f compose.yaml up app

# to stop all services do: docker compose stop

# to check which services are running do: docker ps
# to check which services are running and which are not running do: docker ps -a

# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "app".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  app:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: handwriting-app
    # If your application exposes a port, uncomment the following lines and change
    # the port numbers as needed. The first number is the host port and the second
    # is the port inside the container.
    ports:
      - "8501:8501"
    
  server:
    build:
      context: .
      dockerfile: server.Dockerfile
    container_name: handwriting-server
    ports:
      - "8080:8080"
    networks:
      - fl_network
    environment:
      - PYTHONBUFFERED=1
    volumes:
      - ./models:/app/models

  client0:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: handwriting-client_0
    networks:
      - fl_network
    depends_on:
      - server
    environment:
      - PYTHONBUFFERED=1
      - PARTITION_ID=0
      - SERVER_ADDRESS=server:8080
    
  client1:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: handwriting-client_1
    networks:
      - fl_network
    depends_on:
      - server
    environment:
      - PYTHONBUFFERED=1
      - PARTITION_ID=1
      - SERVER_ADDRESS=server:8080
  
  client2:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: handwriting-client_2
    networks:
      - fl_network
    depends_on:
      - server
    environment:
      - PYTHONBUFFERED=1
      - PARTITION_ID=2
      - SERVER_ADDRESS=server:8080
  
  client3:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: handwriting-client_3
    networks:
      - fl_network
    depends_on:
      - server
    environment:
      - PYTHONBUFFERED=1
      - PARTITION_ID=3
      - SERVER_ADDRESS=server:8080
  
  client4:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: handwriting-client_4
    networks:
      - fl_network
    depends_on:
      - server
    environment:
      - PYTHONBUFFERED=1
      - PARTITION_ID=4
      - SERVER_ADDRESS=server:8080
  
  client5:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: handwriting-client_5
    networks:
      - fl_network
    depends_on:
      - server
    environment:
      - PYTHONBUFFERED=1
