[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handwriting-recognition"
version = "1.1.1"
description = "Federated handwriting recognition"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.32.1",
    "flwr-datasets[vision]>=0.6.0",
    "datasets>=3.0.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.32.1"

[tool.flwr.app.components]
serverapp = "FL.fl_server:app"
clientapp = "FL.fl_client:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-epochs = 1
learning-rate = 0.001
batch-size = 512
fraction-evaluate = 1.0
use-augmentation = false  # Setze auf true für Augmentation
augmentation-type = "light"  # "light", "standard", oder "pixel"

[tool.uv]
# flwr 1.32.1 needs rich>=14 but flwr-datasets 0.6.0 needs rich<14. Pin rich to the lower
# range (flwr 1.32.1 runs on it) so the deployment runtime's uv resolver can install the app
# dependencies at run time.
override-dependencies = ["rich>=13.5,<14"]
