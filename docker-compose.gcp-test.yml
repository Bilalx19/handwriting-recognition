services:
  superlink:
    image: flwr/superlink:1.32.1
    command:
      - --insecure
      - --isolation
      - process
    ports:
      - "9093:9093"

  supernode-1:
    image: flwr/supernode:1.32.1
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - partition-id=0 num-partitions=4
    depends_on:
      - superlink

  supernode-2:
    image: flwr/supernode:1.32.1
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - partition-id=1 num-partitions=4
    depends_on:
      - superlink

  serverapp:
    image: handwriting-superexec:local
    command:
      - --insecure
      - --appio-api-address
      - superlink:9091
      - --plugin-type
      - serverapp
    depends_on:
      - superlink

  clientapp-1:
    image: handwriting-superexec:local
    command:
      - --insecure
      - --appio-api-address
      - supernode-1:9094
      - --plugin-type
      - clientapp
    depends_on:
      - supernode-1

  clientapp-2:
    image: handwriting-superexec:local
    command:
      - --insecure
      - --appio-api-address
      - supernode-2:9094
      - --plugin-type
      - clientapp
    depends_on:
      - supernode-2

  runner:
    build:
      context: .
      dockerfile: dockerfile
    command: ["sh", "-c", "sleep 15 && flwr run . local-deployment --stream"]
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      - superlink
      - supernode-1
      - supernode-2
      - serverapp
      - clientapp-1
      - clientapp-2
