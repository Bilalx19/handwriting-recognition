apiVersion: apps/v1
kind: Deployment
metadata:
  name: supernode-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supernode-3
  template:
    metadata:
      labels:
        app: supernode-3
    spec:
      containers:
      - name: supernode
        image: flwr/supernode:1.32.1
        args:
          - "--insecure"
          - "--superlink"
          - "superlink-service:9092"
          - "--clientappio-api-address"
          - "0.0.0.0:9094"
          - "--isolation"
          - "process"
          - "--node-config"
          - "partition-id=2 num-partitions=4"
        ports:
        - containerPort: 9094
---
apiVersion: v1
kind: Service
metadata:
  name: supernode-3-service
spec:
  selector:
    app: supernode-3
  ports:
  - protocol: TCP
    port: 9094
    targetPort: 9094