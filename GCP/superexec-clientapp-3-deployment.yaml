apiVersion: apps/v1
kind: Deployment
metadata:
  name: superexec-clientapp-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superexec-clientapp-3
  template:
    metadata:
      labels:
        app: superexec-clientapp-3
    spec:
      containers:
      - name: superexec-clientapp
        image: us-central1-docker.pkg.dev/fml-handwriting-2026/flower-gcp-example-artifacts/handwriting-superexec:0.0.1
        args:
          - "--insecure"
          - "--appio-api-address"
          - "supernode-3-service:9094"
          - "--plugin-type"
          - "clientapp"
---