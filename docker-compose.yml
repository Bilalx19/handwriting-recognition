services:
  superlink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl-superlink
    working_dir: /app
    command:
      - flower-superlink
      - --insecure
      - --fleet-api-address
      - 0.0.0.0:9092
      - --control-api-address
      - 0.0.0.0:9093
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 9092)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - model_data:/app/model
      - metrics:/app/metrics

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl-server
    working_dir: /app
    environment:
      HF_HOME: /tmp/huggingface
    command:
      - flwr
      - run
      - .
      - local-deployment
      - --stream
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - model_data:/app/model
      - metrics:/app/metrics

  client1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl-client-1
    working_dir: /app
    environment:
      HF_HOME: /tmp/huggingface
    command:
      - flower-supernode
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --node-config
      - partition-id=0 num-partitions=4
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - metrics:/app/metrics
      - hf_cache:/tmp/huggingface

  client2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl-client-2
    working_dir: /app
    environment:
      HF_HOME: /tmp/huggingface
    command:
      - flower-supernode
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9095
      - --node-config
      - partition-id=1 num-partitions=4
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - metrics:/app/metrics
      - hf_cache:/tmp/huggingface

  client3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl-client-3
    working_dir: /app
    environment:
      HF_HOME: /tmp/huggingface
    command:
      - flower-supernode
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9096
      - --node-config
      - partition-id=2 num-partitions=4
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - metrics:/app/metrics
      - hf_cache:/tmp/huggingface

  client4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl-client-4
    working_dir: /app
    environment:
      HF_HOME: /tmp/huggingface
    command:
      - flower-supernode
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9097
      - --node-config
      - partition-id=3 num-partitions=4
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - metrics:/app/metrics
      - hf_cache:/tmp/huggingface

  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: fl-dashboard
    ports:
      - "8501:8501"
    volumes:
      - metrics:/app/metrics:ro
      - model_data:/app/model:ro
    restart: unless-stopped

  client0-dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: fl-client0-dashboard
    command: ["streamlit", "run", "client_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      CLIENT_ID: "0"
    ports:
      - "8502:8501"
    volumes:
      - metrics:/app/metrics:ro
      - model_data:/app/model:ro
    restart: unless-stopped

  client1-dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: fl-client1-dashboard
    command: ["streamlit", "run", "client_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      CLIENT_ID: "1"
    ports:
      - "8503:8501"
    volumes:
      - metrics:/app/metrics:ro
      - model_data:/app/model:ro
    restart: unless-stopped

  client2-dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: fl-client2-dashboard
    command: ["streamlit", "run", "client_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      CLIENT_ID: "2"
    ports:
      - "8504:8501"
    volumes:
      - metrics:/app/metrics:ro
      - model_data:/app/model:ro
    restart: unless-stopped

  client3-dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: fl-client3-dashboard
    command: ["streamlit", "run", "client_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      CLIENT_ID: "3"
    ports:
      - "8505:8501"
    volumes:
      - metrics:/app/metrics:ro
      - model_data:/app/model:ro
    restart: unless-stopped

volumes:
  model_data:
  metrics:
  hf_cache:
